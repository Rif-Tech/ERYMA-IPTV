name: multiptv
description: "MultIPTV - lecteur IPTV (M3U / Xtream Codes) pour mobile, tablette et TV."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State & navigation
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0

  # Network
  dio: ^5.7.0

  # Local DB
  drift: ^2.28.0
  drift_flutter: ^0.2.4

  # Player
  media_kit: ^1.2.0
  media_kit_video: ^1.3.0
  media_kit_libs_video: ^1.0.6

  # Device / storage
  device_info_plus: ^12.0.0
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.3
  package_info_plus: ^9.0.0
  crypto: ^3.0.6
  # Native crash reporting: a 4K decode failure on a weak box is usually a native crash (mpv/
  # MediaCodec/GPU driver), invisible to any Dart try/catch or to the Supabase app_logs pipeline.
  sentry_flutter: ^9.0.0
  path_provider: ^2.1.5
  wakelock_plus: ^1.2.10
  flutter_foreground_task: ^8.17.0

  # UI
  qr_flutter: ^4.1.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  file_picker: ^10.0.0
  url_launcher: ^6.3.1
  xml: ^6.5.0

dev_dependencies:
  sentry_dart_plugin: ^3.4.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.28.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: flutter
  org: riftech
  # Matches --split-debug-info in scripts/build-release.ps1; without this the plugin looks in its
  # own default location and silently finds nothing to upload.
  symbols_path: build/symbols
