# Supabase local development configuration for MultIPTV.
project_id = "multiptv"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"

# Device-facing functions authenticate with MAC + device key, not a Supabase JWT.
[functions.device-register]
verify_jwt = false

[functions.device-playlists]
verify_jwt = false

[functions.app-info]
verify_jwt = false

[functions.portal-login]
verify_jwt = false

[functions.portal-playlists]
verify_jwt = false
