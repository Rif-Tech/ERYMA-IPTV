# Supabase local development configuration for MultIPTV.
project_id = "multiptv"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:3000/auth/callback", "http://100.88.208.52:3000", "http://100.88.208.52:3000/auth/callback"]
jwt_expiry = 3600
# End users create their own account (e-mail + password) from the portal.
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[edge_runtime]
enabled = true
policy = "per_worker"

# Device-facing functions authenticate with the install secret (x-device-id / x-device-secret),
# not a Supabase JWT; pairing-confirm verifies the user's JWT itself.
[functions.app-info]
verify_jwt = false

[functions.featured]
verify_jwt = false

[functions.tmdb]
verify_jwt = false

[functions.watch-events]
verify_jwt = false

[functions.pairing-create]
verify_jwt = false

[functions.pairing-status]
verify_jwt = false

[functions.pairing-confirm]
verify_jwt = false

[functions.device-session]
verify_jwt = false

[functions.device-context]
verify_jwt = false

[functions.device-progress]
verify_jwt = false
